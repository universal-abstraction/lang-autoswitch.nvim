name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Run tests
        run: make test
      - name: Probe (temporary) - is vim.system on_exit a fast context?
        run: |
          nvim --headless -u NONE -c 'lua local r={}; vim.system({"true"}, {}, function() r.fast=vim.in_fast_event(); r.fn={pcall(vim.fn.stdpath, "state")}; r.notify={pcall(vim.notify, "x", vim.log.levels.WARN)}; r.done=true end); vim.wait(2000, function() return r.done end); io.stdout:write("\nPROBE " .. vim.inspect(r, {newline=" ", indent=""}) .. "\n"); vim.cmd("qa!")' 2>&1

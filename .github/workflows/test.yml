name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Run tests
        run: make test
      - name: Probe (temporary) - is vim.system on_exit a fast context?
        run: |
          nvim --headless -u NONE -c 'lua local done=false; vim.system({"true"}, {}, function() print("in_fast_event=" .. tostring(vim.in_fast_event()) .. " api_ok=" .. tostring(pcall(vim.api.nvim_get_mode))); done=true end); vim.wait(2000, function() return done end); io.stdout:write("\n"); vim.cmd("qa!")' 2>&1
